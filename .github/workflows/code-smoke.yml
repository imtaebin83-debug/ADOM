name: Code smoke tests

on:
  pull_request:
  push:
    branches:
      - main
      - jetson
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install project and lightweight test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --editable .

      - name: Run artifact guard
        run: python scripts/check_git_artifacts.py

      - name: Run synthetic and static tests
        env:
          PYTHONPATH: ${{ github.workspace }}/src
        run: python -m unittest discover -s tests -v
