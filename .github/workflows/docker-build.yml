name: Build, smoke-test, and push training image

on:
  push:
    branches:
      - main
    paths:
      - Dockerfile
      - "requirements/**"
      - "src/**"
      - "configs/**"
      - "tests/**"
      - "scripts/**"
      - ".github/workflows/docker-build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build image for project smoke test
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          load: true
          platforms: linux/amd64
          tags: adom-mmseg:smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run project tests inside the dependency image
        run: >-
          docker run --rm
          -v "${GITHUB_WORKSPACE}:/workspace/adom/repo"
          -e PYTHONPATH=/workspace/adom/repo/src
          adom-mmseg:smoke
          python -m unittest discover -s /workspace/adom/repo/tests -v

      - name: Push tested image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/adom-mmseg:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/adom-mmseg:${{ github.sha }}
          cache-from: type=gha
