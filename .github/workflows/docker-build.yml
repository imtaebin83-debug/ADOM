name: Build, smoke-test, and push training image

on:
  push:
    branches:
      - main
    paths:
      - Dockerfile
      - "requirements/**"
      - "src/**"
      - "configs/**"
      - "tests/**"
      - "scripts/**"
      - ".github/workflows/docker-build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Run repository artifact guard
        run: python scripts/check_git_artifacts.py

      - name: Build image for project smoke test
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          build-args: |
            ADOM_GIT_SHA=${{ github.sha }}
          load: true
          platforms: linux/amd64
          tags: adom-mmseg:smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run training-image contract tests inside the dependency image
        # Keep this as an explicit training-surface allowlist. The repository-wide
        # suite, including autonomy/ROS, remains mandatory in code-smoke.yml.
        run: >-
          docker run --rm
          -v "${GITHUB_WORKSPACE}:/opt/adom-tests/repo:ro"
          -e PYTHONPATH=/opt/adom/src:/opt/adom-tests/repo
          adom-mmseg:smoke
          python -m unittest -v
          tests.test_adom_data_preprocessing
          tests.test_b2_eadom_contract
          tests.test_b5_capacity_domain_contract
          tests.test_data_pipeline
          tests.test_evaluation
          tests.test_mmseg_integration
          tests.test_paper_eval
          tests.test_runtime_contracts
          tests.test_semantic20_aggregate
          tests.test_semantic20_clean_contract
          tests.test_semantic20_evaluation
          tests.test_semantic20_handoff
          tests.test_semantic20_preprocessing
          tests.test_semantic20_training
          tests.test_semantic20_uncertainty
          tests.test_ta0_recipe
          tests.test_target_adaptation

      - name: Verify immutable image source and Semantic20 assets
        run: >-
          docker run --rm
          adom-mmseg:smoke
          python -c "import os; from adom.data.semantic20 import resource_path; assert os.environ['ADOM_GIT_SHA'] == '${{ github.sha }}'; assert resource_path('rellis','splits','train.txt').is_file(); assert resource_path('rugd','config','label_mapping.json').is_file(); print('image-contract-pass')"

      - name: Push tested image
        run: |
          docker tag adom-mmseg:smoke "${{ secrets.DOCKERHUB_USERNAME }}/adom-mmseg:latest"
          docker tag adom-mmseg:smoke "${{ secrets.DOCKERHUB_USERNAME }}/adom-mmseg:${{ github.sha }}"
          docker push "${{ secrets.DOCKERHUB_USERNAME }}/adom-mmseg:latest"
          docker push "${{ secrets.DOCKERHUB_USERNAME }}/adom-mmseg:${{ github.sha }}"
