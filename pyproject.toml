[build-system]
requires = ["setuptools>=69.5.1", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "adom"
version = "0.1.0"
description = "ADOM off-road perception data and MMSegmentation extensions"
requires-python = ">=3.10"
dependencies = [
  "numpy==1.24.4",
  "Pillow>=9.0",
  "PyYAML>=6.0",
  "tqdm>=4.60",
]

[project.scripts]
adom-semantic20-preprocess = "adom.data.semantic20:main"
adom-semantic20-aggregate = "adom.runtime.semantic20_aggregate:main"
adom-semantic20-ta-package = "adom.data.target_adaptation:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"data.rellis" = ["config/*.yaml", "splits/*.txt"]
"data.rugd" = ["config/*.json", "splits/*.txt"]
"data.semantic_20" = ["config/*.yaml"]
"data.ycor" = ["config/*.json"]
