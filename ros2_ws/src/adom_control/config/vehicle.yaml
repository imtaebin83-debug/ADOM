pca9685_control:
  ros__parameters:
    wheelbase_m: 0.33
    # Nominal open-loop command range; this is not measured vehicle speed.
    max_speed_mps: 6.0
    # Disabled until the XL-5 brake/reverse sequence is tested on this vehicle.
    max_reverse_speed_mps: 3.0
    # User-facing angle settings use degrees; ROS messages remain in radians.
    max_steering_angle_deg: 25.7831

    command_rate_hz: 50.0
    command_timeout_sec: 0.25
    # Hold a valid neutral pulse while the XL-5 boots and arms.
    esc_arm_duration_sec: 3.0
    drive_topic: /drive
    cmd_vel_topic: /cmd_vel
    # Keep false during teleop; add a proper command mux before enabling both sources.
    enable_cmd_vel: false

    # Jetson Orin Nano 40-pin header bus. Confirm with `i2cdetect -l`.
    i2c_bus: 7
    i2c_address: 64       # 0x40
    pwm_frequency_hz: 50.0
    esc_channel: 0
    steering_channel: 1

    # Placeholder calibration values: measure with the vehicle lifted.
    esc_neutral_us: 1500.0
    esc_forward_max_us: 2000.0
    esc_reverse_max_us: 1000.0
    steering_center_us: 1500.0
    steering_left_us: 1000.0
    steering_right_us: 2000.0

gamepad_control:
  ros__parameters:
    joy_topic: /joy
    output_drive_topic: /drive

    # Nav2 publishes Twist on /cmd_vel. For a F1TENTH Ackermann planner, use
    # autonomous_input_type: ackermann and publish to /drive/autonomous.
    autonomous_input_type: twist
    autonomous_cmd_vel_topic: /cmd_vel
    autonomous_drive_topic: /drive/autonomous
    mode_topic: /adom/control/mode

    # Default Linux X-input layout. Verify with `ros2 topic echo /joy`.
    right_stick_x_axis: 2
    left_stick_y_axis: 1
    manual_button: 3       # X
    autonomous_button: 0   # A
    stop_button: 1         # B
    steering_axis_scale: 1.0
    throttle_axis_scale: 1.0
    stick_deadzone: 0.10

    max_forward_speed_mps: 6.0
    max_reverse_speed_mps: 3.0
    max_steering_angle_deg: 24
    wheelbase_m: 0.33s
    joy_timeout_sec: 0.50
    autonomous_timeout_sec: 0.25
    publish_rate_hz: 50.0

data_recorder:
  ros__parameters:
    joy_topic: /joy
    # 8BitDo Linux mapping: verify Y's index with `ros2 topic echo /joy`.
    record_button: 4       # Y
    # Relative paths are resolved from $ADOM_REPO_ROOT, or the launch directory.
    capture_root: data/captures
    # RGB-only collection: never record depth, GNSS, IMU, or control data.
    topic_regex: "^/zed(/.*)?/rgb(/.*)?$"
    max_size_gb: 10.0
    size_check_period_sec: 0.5
    # Smaller split files bound the overshoot when the 10 GB limit is reached.
    bag_split_size_mb: 1024
    status_topic: /adom/recording/status
