navsat_transform:
  ros__parameters:
    frequency: 20.0
    delay: 3.0
    zero_altitude: true
    publish_filtered_gps: true
    broadcast_utm_transform: false
    wait_for_datum: false
    # ZED orientation must be validated as ENU and globally referenced before use.
    # A single-antenna RTK fix does not provide heading. Prefer dual-antenna GNSS
    # heading or set a surveyed datum/heading for repeatable field operation.
    use_odometry_yaw: false
    magnetic_declination_radians: 0.0
    yaw_offset: 0.0
