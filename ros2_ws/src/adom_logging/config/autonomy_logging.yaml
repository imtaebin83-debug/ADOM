gps_track_logger:
  ros__parameters:
    fix_topic: /fix
    path_topic: /adom/logging/gps_path
    status_topic: /adom/logging/gps_status
    frame_id: gps_recording_origin
    minimum_step_m: 0.05
    maximum_covariance_m2: 25.0
    maximum_points: 20000

autonomy_data_recorder:
  ros__parameters:
    capture_root: data/autonomy_bags
    auto_start: true
    session_prefix: autonomy
    max_size_gb: 20.0
    size_check_period_sec: 0.5
    bag_split_size_mb: 1024
    status_topic: /adom/recording/status
    # Keep full-rate camera/confidence/overlay/path/IMU/TF out of the live bag.
    # The evidence mask is a 2 Hz sample configured by adom_perception; the
    # semantic costmap is a small 80x60 grid. Per-class pixel counts/ratios are
    # embedded in /adom/perception/status at the inference rate.
    # Raw /fix samples preserve the driven GPS route without repeatedly writing
    # the growing nav_msgs/Path published on /adom/logging/gps_path.
    topic_regex: "^/(adom/perception/(status|semantic20_mask_evidence)|adom/navigation/(semantic_costmap|costmap_status|planned_speed|rule_status|action_latency)|adom/control/(local_path_status|mode|pwm_us)|adom/logging/gps_status|cmd_vel|drive(/autonomous)?|emergency_stop|fix)$"
