adom_perception:
  ros__parameters:
    image_topic: /zed/zed_node/rgb/color/rect/image
    mask_topic: /adom/perception/semantic20_mask
    # Recorder-only sample of the same mono8 mask. The full-rate mask remains
    # available to the costmap without forcing rosbag to serialize every frame.
    evidence_mask_topic: /adom/perception/semantic20_mask_evidence
    evidence_mask_fps: 2.0
    confidence_topic: /adom/perception/confidence
    overlay_topic: /adom/perception/overlay
    status_topic: /adom/perception/status
    # Empty resolves to the installed canonical
    # data/semantic_20/config/bridge_mapping.yaml resource.
    bridge_mapping_path: ""
    config_path: ""
    checkpoint_path: ""
    device: cuda:0
    target_fps: 30.0
    overlay_alpha: 0.45
