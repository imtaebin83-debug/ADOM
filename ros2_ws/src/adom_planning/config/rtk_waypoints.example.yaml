frame_id: map
waypoints:
  # Replace with surveyed WGS84 coordinates.
  # A null heading is derived from this waypoint toward the next waypoint.
  # An explicit heading uses ENU radians: 0=east, +pi/2=north.
  - {latitude: 37.0000000, longitude: 127.0000000, altitude: 0.0, heading: null}
  - {latitude: 37.0000100, longitude: 127.0000100, altitude: 0.0, heading: null}
  - {latitude: 37.0000200, longitude: 127.0000150, altitude: 0.0, heading: 1.5708}
