frame_id: map
waypoints:
  # Replace with surveyed WGS84 coordinates.
  # A null heading is derived from this waypoint toward the next waypoint.
  # An explicit heading_deg uses ENU degrees: 0=east, +90=north.
  - {latitude: 37.0000000, longitude: 127.0000000, altitude: 0.0, heading_deg: null}
  - {latitude: 37.0000100, longitude: 127.0000100, altitude: 0.0, heading_deg: null}
  - {latitude: 37.0000200, longitude: 127.0000150, altitude: 0.0, heading_deg: 90.0}
