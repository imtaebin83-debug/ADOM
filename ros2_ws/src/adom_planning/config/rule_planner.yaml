rule_planner:
  ros__parameters:
    costmap_topic: /adom/navigation/semantic_costmap
    cmd_vel_topic: /cmd_vel
    # The local path controller owns /cmd_vel. Enable only for planner-only tests.
    publish_cmd_vel: false
    local_path_topic: /adom/navigation/local_path
    path_marker_topic: /adom/navigation/rule_path
    status_topic: /adom/navigation/rule_status
    # First /cmd_vel causally produced from each camera-stamped costmap.
    action_latency_topic: /adom/navigation/action_latency
    action_latency_window: 300
    publish_rate_hz: 20.0
    # Shorter than the existing 0.25 s gamepad/PCA9685 command watchdog chain.
    costmap_timeout_sec: 0.20
    # Temporary field tolerance for observed camera/DDS latency spikes.
    max_source_age_sec: 0.40

    wheelbase_m: 0.33
    max_steering_deg: 20.0
    lookahead_m: 3.0
    path_step_m: 0.10
    # Receding-horizon direction tree: 5 actions (-20,-10,0,10,20) per level.
    tree_depth: 3
    tree_branch_steering_deg: 10.0
    steering_change_penalty: 4.0
    corridor_half_width_m: 0.18
    unknown_cost: 70.0
    lethal_cost: 90
    stop_distance_m: 0.30

    # Below the hardware control ceiling of 0.30 m/s.
    max_speed_mps: 0.25
    min_speed_mps: 0.08
    steering_penalty: 8.0
    # Depth-projected obstacle distance weighting.
    distance_decay_m: 1.25
    clearance_penalty: 35.0
    slow_distance_m: 2.0
