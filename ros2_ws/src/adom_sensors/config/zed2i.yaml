/**:
  ros__parameters:
    general:
      camera_model: zed2i
      grab_resolution: HD720
      grab_frame_rate: 15
      pub_resolution: CUSTOM
      pub_downscale_factor: 2.0
      pub_frame_rate: 15.0
    depth:
      # Field-tuning candidates: prefer reliable near-field measurements over
      # maximum depth density. NEURAL is the accuracy/compute compromise for
      # the Orin Nano; NEURAL_PLUS must not be enabled without a joint
      # ZED+SegFormer latency test.
      depth_mode: NEURAL
      # Match the only current depth consumer. Keeping the SDK and costmap
      # ranges equal prevents distant jitter from entering DDS while retaining
      # the near-field 0.30 m safety envelope.
      min_depth: 0.30
      max_depth: 8.0
      depth_stabilization: 0
      # SDK confidence is 0=best, 100=worst; values above each threshold are
      # invalidated. Therefore 50 is stricter than 100 for both filters.
      depth_confidence: 50
      depth_texture_conf: 50
      remove_saturated_areas: true
      point_cloud_freq: 5.0
      publish_depth_map: true
      publish_depth_info: false
      publish_point_cloud: false
      publish_depth_confidence: false
      publish_disparity: false
    pos_tracking:
      pos_tracking_enabled: false
      imu_fusion: false
      two_d_mode: false
      # The external localization stack owns map->odom and odom->base_link.
      publish_tf: false
      publish_map_tf: false
    sensors:
      publish_imu: true
      publish_imu_raw: false
      publish_mag: false
      publish_imu_tf: true
    gnss_fusion:
      # ADOM initially uses robot_localization. Do not enable both fusion paths.
      gnss_fusion_enabled: false
