dataset_name: adom_cost4_rellis_rugd_ycor_goose_v1
mapping_version: v1.0
num_classes: 4
ignore_index: 255
reduce_zero_label: false

target_classes:
  0: paved
  1: natural_low
  2: medium
  3: high_obstacle
  255: ignore

rellis:
  # RELLIS raw IDs are normalized by src/data/rellis into contiguous
  # Semantic20 IDs before this bridge applies the equivalent Cost4 policy.
  input_contract: semantic20_indexed_mask
  source_to_target:
    0: {source_class: dirt, target_class: natural_low, target_id: 1}
    1: {source_class: grass, target_class: natural_low, target_id: 1}
    2: {source_class: tree, target_class: high_obstacle, target_id: 3}
    3: {source_class: pole, target_class: high_obstacle, target_id: 3}
    4: {source_class: water, target_class: high_obstacle, target_id: 3}
    5: {source_class: sky, target_class: ignore, target_id: 255}
    6: {source_class: vehicle, target_class: high_obstacle, target_id: 3}
    7: {source_class: object, target_class: high_obstacle, target_id: 3}
    8: {source_class: asphalt, target_class: paved, target_id: 0}
    9: {source_class: building, target_class: high_obstacle, target_id: 3}
    10: {source_class: log, target_class: high_obstacle, target_id: 3}
    11: {source_class: person, target_class: high_obstacle, target_id: 3}
    12: {source_class: fence, target_class: high_obstacle, target_id: 3}
    13: {source_class: bush, target_class: medium, target_id: 2}
    14: {source_class: concrete, target_class: paved, target_id: 0}
    15: {source_class: barrier, target_class: high_obstacle, target_id: 3}
    16: {source_class: puddle, target_class: medium, target_id: 2}
    17: {source_class: mud, target_class: medium, target_id: 2}
    18: {source_class: rubble, target_class: high_obstacle, target_id: 3}
    255: {source_class: ignore, target_class: ignore, target_id: 255}

rugd:
  input_contract: original_index_label_mask
  source_to_target:
    0: {source_class: void_or_unlabelled, target_class: ignore, target_id: 255}
    1: {source_class: dirt, target_class: natural_low, target_id: 1}
    2: {source_class: sand, target_class: medium, target_id: 2}
    3: {source_class: grass, target_class: natural_low, target_id: 1}
    4: {source_class: tree, target_class: high_obstacle, target_id: 3}
    5: {source_class: pole, target_class: high_obstacle, target_id: 3}
    6: {source_class: water, target_class: high_obstacle, target_id: 3}
    7: {source_class: sky, target_class: ignore, target_id: 255}
    8: {source_class: vehicle, target_class: high_obstacle, target_id: 3}
    9: {source_class: container_or_generic_object, target_class: high_obstacle, target_id: 3}
    10: {source_class: asphalt, target_class: paved, target_id: 0}
    11: {source_class: gravel, target_class: natural_low, target_id: 1}
    12: {source_class: building, target_class: high_obstacle, target_id: 3}
    13: {source_class: mulch, target_class: medium, target_id: 2}
    14: {source_class: rock_bed, target_class: medium, target_id: 2}
    15: {source_class: log, target_class: high_obstacle, target_id: 3}
    16: {source_class: bicycle, target_class: high_obstacle, target_id: 3}
    17: {source_class: person, target_class: high_obstacle, target_id: 3}
    18: {source_class: fence, target_class: high_obstacle, target_id: 3}
    19: {source_class: bush, target_class: medium, target_id: 2}
    20: {source_class: sign, target_class: high_obstacle, target_id: 3}
    21: {source_class: rock, target_class: high_obstacle, target_id: 3}
    22: {source_class: bridge, target_class: high_obstacle, target_id: 3}
    23: {source_class: concrete, target_class: paved, target_id: 0}
    24: {source_class: picnic_table, target_class: high_obstacle, target_id: 3}

ycor:
  input_contract: original_palette_mask
  source_palette_rgb:
    0: [255, 255, 255]
    1: [40, 80, 0]
    2: [128, 255, 0]
    3: [178, 176, 153]
    4: [255, 0, 0]
    5: [1, 88, 255]
    6: [156, 76, 30]
    7: [255, 0, 128]
    8: [0, 160, 0]
  source_to_target:
    0: {source_class: background_or_unlabelled, target_class: ignore, target_id: 255}
    1: {source_class: high_vegetation, target_class: high_obstacle, target_id: 3}
    2: {source_class: traversable_grass, target_class: natural_low, target_id: 1}
    3: {source_class: smooth_trail, target_class: natural_low, target_id: 1}
    4: {source_class: obstacle, target_class: high_obstacle, target_id: 3}
    5: {source_class: sky, target_class: ignore, target_id: 255}
    6: {source_class: rough_trail, target_class: medium, target_id: 2}
    7: {source_class: puddle, target_class: medium, target_id: 2}
    8: {source_class: non_traversable_low_vegetation, target_class: high_obstacle, target_id: 3}

