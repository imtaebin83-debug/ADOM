    4: {source_class: obstacle, target_class: object, target_id: 7, use: true}
    5: {source_class: leaves, target_class: ignore, target_id: 255, use: false}
    6: {source_class: street_light, target_class: ignore, target_id: 255, use: false}
    7: {source_class: bikeway, target_class: ignore, target_id: 255, use: false}
    8: {source_class: ego_vehicle, target_class: ignore, target_id: 255, use: false}
    9: {source_class: pedestrian_crossing, target_class: ignore, target_id: 255, use: false}
    10: {source_class: road_block, target_class: barrier, target_id: 15, use: true}
    11: {source_class: road_marking, target_class: asphalt, target_id: 8, use: true}
    12: {source_class: car, target_class: vehicle, target_id: 6, use: true}
    13: {source_class: bicycle, target_class: ignore, target_id: 255, use: false}
    14: {source_class: person, target_class: person, target_id: 11, use: true}
    15: {source_class: bus, target_class: vehicle, target_id: 6, use: true}
    16: {source_class: forest, target_class: ignore, target_id: 255, use: false}
    17: {source_class: bush, target_class: bush, target_id: 13, use: true}
    18: {source_class: moss, target_class: dirt, target_id: 0, use: true}
    19: {source_class: traffic_light, target_class: artifact, target_id: 21, use: true}
